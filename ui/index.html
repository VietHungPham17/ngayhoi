<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký Ngày hội việc làm</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
      }
      h2 {
        text-align: center;
        color: #333;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
        color: #666;
      }
      input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 0.75rem;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background-color: #218838;
      }
      .alert {
        padding: 1rem;
        margin-top: 1rem;
        border-radius: 4px;
        display: none;
      }
      .alert-success {
        background-color: #d4edda;
        color: #155724;
      }
      .alert-error {
        background-color: #f8d7da;
        color: #721c24;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Đăng ký Ngày hội việc làm</h2>
      <form id="registerForm">
        <div class="form-group">
          <label for="ma_sv">Mã sinh viên</label>
          <input type="text" id="ma_sv" name="ma_sv" required placeholder="Ví dụ: 22020001">
        </div>
        <div class="form-group">
          <label for="ma_phien">Mã phiên</label>
          <input type="text" id="ma_phien" name="ma_phien" required placeholder="Ví dụ: P01">
        </div>
        <button type="submit">Đăng ký</button>
      </form>
      <div id="messageBox" class="alert"></div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
